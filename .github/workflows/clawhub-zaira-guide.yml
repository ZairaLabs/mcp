name: ClawHub Zaira Guide

on:
  pull_request:
    paths:
      - "integrations/openclaw/zaira-guide/**"
      - "tests/clawhub-zaira-guide.test.cjs"
      - ".github/workflows/clawhub-zaira-guide.yml"
      - ".github/workflows/clawhub-zaira-guide-publish.yml"

permissions:
  contents: read

jobs:
  bundle-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test bundle attribution contract
        run: node --test tests/clawhub-zaira-guide.test.cjs
