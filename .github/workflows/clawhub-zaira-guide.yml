name: ClawHub Zaira Guide

on:
  pull_request:
    paths:
      - "integrations/openclaw/zaira-guide/**"
      - "tests/clawhub-zaira-guide.test.cjs"
      - ".github/workflows/clawhub-zaira-guide.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish version 0.1.1 to ClawHub
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  bundle-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test bundle attribution contract
        run: node --test tests/clawhub-zaira-guide.test.cjs

  validate-or-publish:
    needs: bundle-tests
    # Pin the current publisher because ClawHub's live package contract now
    # requires an explicit plugin manifest even for compatible bundles.
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@1a3ee6e015af1d9a83a9ce271b56b22d9e17ad20
    with:
      source: ZairaLabs/mcp
      ref: ${{ github.sha }}
      dry_run: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
      owner: zairalabs
      family: bundle-plugin
      version: 0.1.1
      source_repo: ZairaLabs/mcp
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      source_path: integrations/openclaw/zaira-guide
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
